name: ACARMusic
description: "A premium local music player app for Samsung Android devices."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  on_audio_query: ^2.9.0
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # State
  provider: ^6.1.2

  # Permissions
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  palette_generator: ^0.3.3
  cached_network_image: ^3.4.1

  # Utils
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
